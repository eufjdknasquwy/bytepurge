name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libgtkmm-3.0-dev nlohmann-json3-dev libayatana-appindicator3-dev pkg-config

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: bytepurge-bin
        path: build/bytepurge
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtkmm-3.0-1v5 libayatana-appindicator3-1

    - name: Download binary artifact
      uses: actions/download-artifact@v4
      with:
        name: bytepurge-bin
        path: build/

    - name: Make binary executable
      run: chmod +x build/bytepurge

    - name: Smoke Test
      run: ./build/bytepurge --version

    - name: Smoke Test 2
      run: ./build/bytepurge --list | grep apt

    - name: Integration Test (CLI)
      run: |
        mkdir -p ~/.cache/gtk-4.0
        touch ~/.cache/gtk-4.0/test_file.txt
        ./build/bytepurge --clear-warning --dry-run | grep gtk-4.0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake ninja-build pkg-config \
          libgtkmm-3.0-dev libayatana-appindicator3-dev nlohmann-json3-dev \
          librsvg2-bin wget

    - name: Download binary artifact
      uses: actions/download-artifact@v4
      with:
        name: bytepurge-bin
        path: build/

    - name: Make binary executable
      run: chmod +x build/bytepurge

    - name: Build AppImage
      id: build_appimage
      if: startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      run: |
        chmod +x build_appimage.sh
        ./build_appimage.sh

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: always() && startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          build/bytepurge
          bytepurge-x86_64.AppImage
        fail_on_unmatched_files: false
        generate_release_notes: true
